<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SIAM U Connect · Web process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#2d3142;font-family:'Geist','Noto Sans Thai',system-ui,sans-serif;display:flex;justify-content:center;padding:48px 28px}.frame{max-width:1120px;width:100%}.eyebrow{font:500 10px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#4f5d75;margin:0 0 8px}h1{font:400 clamp(28px,3.6vw,40px)/1.1 'Instrument Serif','Noto Sans Thai',serif;margin:0 0 24px;letter-spacing:-.02em}svg{width:100%;display:block;overflow:visible}svg text{font-family:'Geist','Noto Sans Thai',sans-serif}.mono{font-family:'Geist Mono',monospace}.lane{fill:rgba(45,49,66,.018)}.rule{stroke:rgba(45,49,66,.12)}.label-rule{stroke:rgba(45,49,66,.2)}.actor{fill:#4f5d75;font:600 9px 'Geist Mono',monospace;letter-spacing:.08em}.step-label{fill:#4f5d75;font:600 7px 'Geist Mono',monospace;letter-spacing:.1em}.step-chip{fill:rgba(45,49,66,.12)}.step-num{fill:#2d3142;font:600 8px 'Geist Mono',monospace}.connector{fill:none;stroke:#4f5d75;stroke-width:1}.connector.focal{stroke:#eb6c36;stroke-width:1.2}.node-mask{fill:#f5f5f5}.node{fill:#fff;stroke:rgba(45,49,66,.25)}.node.focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}.role{fill:rgba(45,49,66,.1)}.role.focal{fill:rgba(235,108,54,.25)}.role-text{fill:#2d3142;font:600 6px 'Geist Mono',monospace}.role-text.focal{fill:#eb6c36}.node-title{fill:#2d3142;font:600 9px 'Noto Sans Thai',sans-serif}.node-sub{fill:#4f5d75;font:6.7px 'Geist Mono','Noto Sans Thai',monospace}.node-tool{fill:#7a8399;font:6.5px 'Geist Mono','Noto Sans Thai',monospace}.data-text{fill:#fff;font:700 5px 'Geist Mono',monospace}.legend-key{fill:#4f5d75;font:600 7px 'Geist Mono',monospace;letter-spacing:.1em}.legend-text{fill:#4f5d75;font:8px 'Noto Sans Thai',sans-serif}.db{fill:#5e7a9b}.task{fill:#7c8f6f}.status{fill:#6e6479}.accent{fill:#eb6c36}
  </style>
</head>
<body><main class="frame">
  <p class="eyebrow">Process · SIAM U Connect · Web</p>
  <h1>จากการเข้าสู่ระบบ สู่คะแนนเกมที่ตรวจสอบได้</h1>
  <svg viewBox="0 0 960 400" role="img" aria-labelledby="web-title web-desc">

    <rect width="960" height="400" fill="#f5f5f5"/><rect width="960" height="400" fill="url(#dots)" opacity=".4"/>

    <g text-anchor="middle"><g class="step-label"><rect class="step-chip" x="190" y="8" width="16" height="16" rx="8"/><text class="step-num" x="198" y="19">1</text><text x="198" y="32">LOGIN</text><rect class="step-chip" x="322" y="8" width="16" height="16" rx="8"/><text class="step-num" x="330" y="19">2</text><text x="330" y="32">VERIFY</text><rect class="step-chip" x="454" y="8" width="16" height="16" rx="8"/><text class="step-num" x="462" y="19">3</text><text x="462" y="32">PLAY</text><rect x="586" y="8" width="16" height="16" rx="8" fill="rgba(235,108,54,.2)"/><text x="594" y="19" fill="#eb6c36" class="mono" font-size="8">4</text><text x="594" y="32" fill="#eb6c36">SCORE</text><rect class="step-chip" x="718" y="8" width="16" height="16" rx="8"/><text class="step-num" x="726" y="19">5</text><text x="726" y="32">SUMMARY</text><rect class="step-chip" x="850" y="8" width="16" height="16" rx="8"/><text class="step-num" x="858" y="19">6</text><text x="858" y="32">RANK</text></g></g>

    <g text-anchor="middle">
      <g><rect class="node-mask" x="148" y="44" width="100" height="64" rx="6"/><rect class="node" x="148" y="44" width="100" height="64" rx="6"/><rect class="role" x="152" y="48" width="20" height="10" rx="2"/><text class="role-text" x="162" y="56">USR</text><text class="node-title" x="198" y="70">กด LINE demo</text><text class="node-sub" x="198" y="84">role + code</text><text class="node-tool" x="198" y="96">LoginPage</text><rect class="task" x="228" y="98" width="16" height="8" rx="2"/><text class="data-text" x="236" y="104">TS</text></g>
      <g><rect class="node-mask" x="280" y="124" width="100" height="64" rx="6"/><rect class="node" x="280" y="124" width="100" height="64" rx="6"/><rect class="role" x="284" y="128" width="20" height="10" rx="2"/><text class="role-text" x="294" y="136">UI</text><text class="node-title" x="330" y="150">ตรวจ session</text><text class="node-sub" x="330" y="164">auth → route</text><text class="node-tool" x="330" y="176">RequireAuth</text><rect class="task" x="284" y="178" width="16" height="8" rx="2"/><text class="data-text" x="292" y="184">TS</text><rect class="db" x="360" y="178" width="16" height="8" rx="2"/><text class="data-text" x="368" y="184">DB</text></g>
      <g><rect class="node-mask" x="412" y="44" width="100" height="64" rx="6"/><rect class="node" x="412" y="44" width="100" height="64" rx="6"/><rect class="role" x="416" y="48" width="20" height="10" rx="2"/><text class="role-text" x="426" y="56">USR</text><text class="node-title" x="462" y="70">เล่นเกม</text><text class="node-sub" x="462" y="84">quiz · sort · match</text><text class="node-tool" x="462" y="96">GamePlay</text><rect class="task" x="492" y="98" width="16" height="8" rx="2"/><text class="data-text" x="500" y="104">ANS</text></g>
      <g><rect class="node-mask" x="544" y="124" width="100" height="64" rx="6"/><rect class="node focal" x="544" y="124" width="100" height="64" rx="6"/><rect class="role focal" x="548" y="128" width="20" height="10" rx="2"/><text class="role-text focal" x="558" y="136">UI</text><text class="node-title" x="594" y="150">คำนวณคะแนน</text><text class="node-sub" x="594" y="164">answers → score</text><text class="node-tool" x="594" y="176">saveDemoScore()</text><rect class="task" x="548" y="178" width="16" height="8" rx="2"/><text class="data-text" x="556" y="184">ANS</text><rect class="db" x="624" y="178" width="16" height="8" rx="2"/><text class="data-text" x="632" y="184">DB</text></g>
      <g><rect class="node-mask" x="676" y="204" width="100" height="64" rx="6"/><rect class="node" x="676" y="204" width="100" height="64" rx="6"/><rect class="role" x="680" y="208" width="20" height="10" rx="2"/><text class="role-text" x="690" y="216">DATA</text><text class="node-title" x="726" y="230">เก็บคะแนนเดโม</text><text class="node-sub" x="726" y="244">localStorage</text><text class="node-tool" x="726" y="256">siamu_demo_*</text><rect class="db" x="680" y="258" width="16" height="8" rx="2"/><text class="data-text" x="688" y="264">DB</text></g>
      <g><rect class="node-mask" x="808" y="284" width="100" height="64" rx="6"/><rect class="node" x="808" y="284" width="100" height="64" rx="6"/><rect class="role" x="812" y="288" width="20" height="10" rx="2"/><text class="role-text" x="822" y="296">OUT</text><text class="node-title" x="858" y="310">แสดงผลรวม</text><text class="node-sub" x="858" y="324">dashboard → rank</text><text class="node-tool" x="858" y="336">MyScore / Ranking</text><rect class="status" x="812" y="338" width="16" height="8" rx="2"/><text class="data-text" x="820" y="344">UI</text></g>
    </g>
    <g><text class="legend-key" x="136" y="372">HANDOFF</text><rect class="task" x="224" y="365" width="16" height="8" rx="2"/><text class="legend-text" x="248" y="372">คำตอบ / session</text><rect class="db" x="358" y="365" width="16" height="8" rx="2"/><text class="legend-text" x="382" y="372">คะแนนในเครื่อง</text><rect class="status" x="498" y="365" width="16" height="8" rx="2"/><text class="legend-text" x="522" y="372">ผลลัพธ์ที่ผู้ใช้เห็น</text><text class="legend-key" x="720" y="372">FOCAL</text><text class="legend-text" x="764" y="372">การบันทึกคะแนน</text><line x1="136" y1="390" x2="168" y2="390" stroke="#4f5d75" marker-end="url(#arrow)"/><text class="legend-text" x="180" y="394">ลำดับการทำงาน</text><line x1="300" y1="390" x2="332" y2="390" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text class="legend-text" x="344" y="394">handoff สำคัญ</text></g>
  </svg>
</main></body></html>
